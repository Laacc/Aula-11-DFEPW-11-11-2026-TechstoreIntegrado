
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore — Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cor-primaria: #1B3A5C;
            --cor-secundaria: #E07B2A;
            --cor-fundo: #F5F0E8;
            --cor-branco: #FFFFFF;
            --cor-texto: #212121;
            --cor-texto-claro: #8B9DAF;
            --cor-sucesso: #27AE60;
            --cor-erro: #E74C3C;
            --cor-borda: #D1C7B7;
            --sombra: 0 10px 40px rgba(27,58,92,0.12);
            --raio-borda: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--cor-branco);
            border-radius: var(--raio-borda);
            box-shadow: var(--sombra);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .form-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--cor-primaria);
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            color: var(--cor-texto-claro);
        }

        .campo-grupo {
            margin-bottom: 20px;
        }

        .campo-grupo label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--cor-primaria);
            margin-bottom: 6px;
        }

        .obrigatorio {
            color: var(--cor-erro);
        }

        .campo-grupo input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            font-family: inherit;
            border: 2px solid var(--cor-borda);
            border-radius: 8px;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            transition: all 0.3s ease;
            outline: none;
        }

        .campo-grupo input:focus {
            border-color: var(--cor-primaria);
            background: var(--cor-branco);
            box-shadow: 0 0 0 3px rgba(27,58,92,0.15);
        }

        .campo-grupo input::placeholder {
            color: var(--cor-texto-claro);
            font-size: 14px;
        }

        .btn-enviar {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            color: var(--cor-branco);
            background-color: var(--cor-secundaria);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-enviar:hover:not(:disabled) {
            background-color: #C96A1F;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(224,123,42,0.4);
        }

        .btn-enviar:disabled {
            background-color: var(--cor-texto-claro);
            cursor: not-allowed;
        }

        .mensagem {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 16px;
            display: none;
        }

        .mensagem.sucesso {
            display: block;
            background-color: #E8F5E9;
            color: var(--cor-sucesso);
            border: 1px solid var(--cor-sucesso);
        }

        .mensagem.erro {
            display: block;
            background-color: #FFEBEE;
            color: var(--cor-erro);
            border: 1px solid var(--cor-erro);
        }

        .rodape {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--cor-texto-claro);
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }

            .form-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-header">
        <div class="logo">🛒</div>
        <h1>TechStore Cadastro</h1>
        <p>Cadastre-se e receba ofertas exclusivas de tecnologia!</p>
    </div>

    <form id="formCadastro">

        <div class="campo-grupo">
            <label for="nome">
                Nome Completo <span class="obrigatorio">*</span>
            </label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex: Maria da Silva"
                required
            >
        </div>

        <div class="campo-grupo">
            <label for="email">
                E-mail <span class="obrigatorio">*</span>
            </label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Ex: maria@email.com"
                required
            >
        </div>

        <div class="campo-grupo">
            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="Ex: (11) 99999-9999"
            >
        </div>

        <button type="submit" class="btn-enviar" id="btnEnviar">
            Cadastrar
        </button>

        <div id="mensagem" class="mensagem" role="status"></div>

    </form>

    <div class="rodape">
        🛒 TechStore &copy; 2026 — Aula de Front-End Web
    </div>

</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // CONFIGURAÇÃO DO SUPABASE

    const SUPABASE_URL = 'https://euwmmjeftaridlxqrjza.supabase.co';

    const SUPABASE_ANON_KEY = 'sb_publishable_KvF_DDfbZBpX-dixj8AoPg_2BCok4k5';

    // Verifica se a biblioteca carregou

    if (!window.supabase) {
        throw new Error('Supabase não carregou. Verifique sua conexão.');
    }

    // Inicializa o cliente

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    // ELEMENTOS HTML

    const formulario = document.getElementById('formCadastro');
    const btnEnviar = document.getElementById('btnEnviar');
    const divMensagem = document.getElementById('mensagem');

    // FUNÇÃO DE MENSAGEM

    function mostrarMensagem(texto, tipo) {
        divMensagem.textContent = texto;
        divMensagem.className = 'mensagem ' + tipo;
    }

    // ENVIO DO FORMULÁRIO

    formulario.addEventListener('submit', async function(evento) {

        evento.preventDefault();

        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const telefone = document.getElementById('telefone').value.trim();

        if (!nome || !email) {
            mostrarMensagem(
                'Por favor, preencha nome e e-mail.',
                'erro'
            );
            return;
        }

        btnEnviar.disabled = true;
        btnEnviar.textContent = 'Enviando...';

        divMensagem.className = 'mensagem';

        try {

            // INSERE OS DADOS NO SUPABASE

            const { error } = await supabaseClient
                .from('cadastros')
                .insert({
                    nome: nome,
                    email: email,
                    telefone: telefone || null
                });

            if (error) {
                console.error('Erro do Supabase:', error);

                mostrarMensagem(
                    'Erro ao cadastrar: ' + error.message,
                    'erro'
                );

            } else {

                mostrarMensagem(
                    '✅ Cadastro realizado com sucesso!',
                    'sucesso'
                );

                formulario.reset();
            }

        } catch (erro) {

            console.error('Erro inesperado:', erro);

            mostrarMensagem(
                'Erro de conexão. Verifique sua internet e tente novamente.',
                'erro'
            );

        } finally {

            // RESTAURA O BOTÃO MESMO SE OCORRER UM ERRO

            btnEnviar.disabled = false;
            btnEnviar.textContent = 'Cadastrar';
        }

    });

</script>

</body>
</html>
